# Числа балансу, що не належать окремому визначенню (GD §23: усі коефіцієнти — у контенті).
#
# Правила гри — межі переваги −100..100, мінімум 1% для КП і КУ, ліміт 3 жетони долі — не тут:
# вони не налаштовуються. Ваги секторів коліс генерації — разом із ланцюжком коліс.

# Колеса (GD §2.3–2.4).
wheel:
  # Сила переваги k, %: сектори успіху множаться на (100 + A·k/100)/100, провалу — на (100 − A·k/100)/100.
  # При k = 50 і A = 100 успіх зростає в 1,5 раза, провал удвічі менший.
  default_strength: 50
  # Окрема сила для типу колеса: «<тип колеса>: k». Поки всі колеса мають типову.
  strength: {}
  # Скільки переваги дає кожне наступне вкладення в дію: спадна віддача, разом не більше +100.
  investment_curve: [20, 12, 7, 4]

# Стріки генерації (GD §4.10). За порогів 85/15 стріки майже не траплялися (0 на ~1600 держав):
# за 70/30 «Золота доба» — ~3% держав, «Андердог» — ~4,5%.
streaks:
  very_good_quality: 70
  very_bad_quality: 30
  length: 3

# Коридор бюджету сили (GD §4.11): межі проміжної сили держави у відсотках медіани.
# Варіант обирає хост (GD §3.4); для NPC коридор ширший — світ має і наддержави, і карликові держави.
# Сила — середня якість коліс і сама тримається в ~70–126% медіани, тож межі — під цю шкалу (GD §24.1).
power_corridors:
  - id: equal_chances
    players: { min_pct: 90, max_pct: 110 }
    npc: { min_pct: 75, max_pct: 133 }
  - id: classic
    players: { min_pct: 75, max_pct: 133 }
    npc: { min_pct: 50, max_pct: 200 }
  - id: full_chaos
    players: { min_pct: 50, max_pct: 200 }
    npc: { min_pct: 33, max_pct: 300 }

# Бюджет сили (GD §4.11): як рахувати проміжну силу держави й зсувати колеса за межами коридору.
power_budget:
  # Сила — зважена середня якість уже обернених складників у відсотках цієї якості (1..99): держава, чиї колеса
  # в середньому дали median_quality, має 100% медіани. Поки жодного складника з вагою немає — 100%.
  median_quality: 50
  # Вага кожного складника (0..100; 0 — не рахується). Розвиненість — один складник із середньою якістю галузей.
  weights:
    area: 2
    population: 2
    development: 2
    gdp: 3
    hdi: 1
    army_size: 1
    army_training: 1
    nuclear: 1
  # Коли сила поза коридором, кожне наступне колесо складника отримує перевагу до середини: вихід за межу у
  # відсоткових пунктах × advantage_pct / 100 вниз (1..1000), не більше max_advantage (1..100).
  advantage_pct: 50
  max_advantage: 30

# Ланцюжок коліс генерації (GD §4.6–4.8).
generation:
  backstory_fragments: { min: 2, max: 4 }
  notable_people: { min: 1, max: 3 }
  # Боєголовки стартового арсеналу: рівноймовірно від min до max (1..100).
  warheads: { min: 2, max: 10 }
  # Перевага колеса ядерного статусу за кожен рівень енергетики й науки відносно світового
  # (0..100): −3 → −3·x, +2 → +2·x.
  nuclear_energy_advantage: 10
  # Перевага колеса ВВП за кожен рівень розвиненості економіки й за кожен рівень суспільства
  # відносно світового (0..100), окремо за кожну галузь: обидві на +2 → +4·x, обидві на −3 → −6·x.
  gdp_development_advantage: 10
  # Перевага колеса ІЛР за кожен крок рівня результату рівня ВВП від partial (0..100):
  # crit_fail → −2·x, fail → −x, success → +x, crit_success → +2·x.
  hdi_gdp_advantage: 15
  # Перевага колеса розміру армії за кожен крок рівня результату рівня ВВП від partial (0..100):
  # crit_fail → −2·x, fail → −x, success → +x, crit_success → +2·x. Багатша держава утримує
  # більшу армію.
  army_size_gdp_advantage: 10
  # Перевага колеса вишколу армії за кожен крок рівня результату рівня ВВП від partial (0..100):
  # crit_fail → −2·x, fail → −x, success → +x, crit_success → +2·x. Багатша держава більше
  # витрачає на навчання.
  army_training_gdp_advantage: 10
  # Перевага колеса вишколу армії за кожен рівень розвиненості військової галузі відносно світового
  # (0..100): рівень −3 дає −3·x, +2 — +2·x.
  army_training_development_advantage: 10
  # Кількість рис стартової постаті: рівноймовірно від min до max (1..3, GD §12.3).
  person_traits: { min: 1, max: 3 }
  # Вік стартової постаті на 1970 рік: рівноймовірно від min до max (16..100).
  person_age: { min: 25, max: 70 }
  # Скільки назв-кандидатів стоїть на колесі назви (1..12): кожна — окремий рівний сектор.
  name_candidates: 5
  # Перевага колеса розвиненості кожної галузі за кожен крок рівня результату рівня населення від
  # partial (−100..100): crit_fail → −2·x, crit_success → +2·x. Додатна — багатолюдніша держава має
  # більше фахівців.
  development_population_advantage: 5
  # Перевага колеса ВВП на душу за кожен крок рівня результату рівня населення від partial
  # (−100..100). Від'ємна — у багатолюднішої держави більше ротів на той самий продукт.
  gdp_population_advantage: -5

# Генерація релігій світу (GD §25.1).
religion:
  # Скільки релігій у світі — рівноймовірно від min до max (1..12) у першому рядку, чий
  # max_countries не менший за кількість держав; більше держав, ніж в останньому рядку, — як в
  # останньому. Рядки — за зростанням max_countries.
  count:
    - { max_countries: 8, min: 3, max: 4 }
    - { max_countries: 20, min: 3, max: 5 }
    - { max_countries: 40, min: 4, max: 6 }
  # Скільки аспектів у божества й догматів у релігії — рівноймовірно від min до max (1..6).
  aspects: { min: 2, max: 3 }
  dogmas: { min: 2, max: 4 }
  # Колесо святого центру: провінції держав цієї віри й нічийні. Вага = (base + родючість ×
  # fertility_pct / 100 + river, якщо є річка), у нічийної — ще × unclaimed_pct / 100; щонайменше 1.
  holy_center: { base: 10, fertility_pct: 100, river: 30, unclaimed_pct: 20 }

# Розмір світу (GD §3.2–3.3).
world:
  # NPC = гравці + колесо(min..max): рівні сектори на кожне число. Діапазон — за часткою NPC, яку
  # обирає хост (GD §14.4). Держав разом — не більше 40 (правило гри).
  npc_extra:
    few: { min: 1, max: 3 }
    normal: { min: 2, max: 6 }
    many: { min: 4, max: 10 }
  # Провінцій на державу до коефіцієнта шаблону карти: рівні сектори min, min + step, …, max.
  provinces_per_country: { min: 60, max: 100, step: 5 }
  # Частка нічийних земель, bp (0..5000): рівні сектори з кроком step.
  unclaimed_bp: { min: 500, max: 1500, step: 100 }
  # Провінцій на карті разом: держав × провінцій на державу × коефіцієнт шаблону обрізається до меж.
  provinces: { min: 400, max: 3500 }

# Колесо ресурсів держави (GD §4.5).
resources:
  # Скільки обертань (родовищ) — рівноймовірно від min до max (1..10) у першому рядку, чий
  # max_provinces не менший за кількість провінцій держави; більше провінцій, ніж в останньому
  # рядку, — як в останньому. Рядки — за зростанням max_provinces. Ресурси не повторюються: якщо
  # придатних ресурсів менше, родовищ менше.
  count:
    - { max_provinces: 50, min: 1, max: 2 }
    - { max_provinces: 100, min: 2, max: 3 }
    - { max_provinces: 1000, min: 3, max: 5 }

# Таймери ходу (GD §6.1): тривалість фази наказів, з якої обирає хост. «Ручний» (без таймера) є завжди.
# Коли час вийшов, рік розв'язується, а за тих, хто не натиснув «Готово», діє автопілот (GD §6.3).
# Значення — за зростанням без повторів.
turn_timers:
  # «Живий», хвилини на хід.
  live_minutes: [2, 3, 4, 5]
  # «Асинхронний», години на хід (для гри через сервер).
  async_hours: [12, 18, 24]
