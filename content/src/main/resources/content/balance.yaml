# Числа балансу, що не належать окремому визначенню (GD §23: усі коефіцієнти — у контенті).
#
# Правила гри — межі переваги −100..100, мінімум 1% для КП і КУ, ліміт 3 жетони долі — не тут:
# вони не налаштовуються. Ваги секторів коліс генерації — разом із ланцюжком коліс.

# Колеса (GD §2.3–2.4).
wheel:
  # Сила переваги k, %: сектори успіху множаться на (100 + A·k/100)/100, провалу — на (100 − A·k/100)/100.
  # При k = 50 і A = 100 успіх зростає в 1,5 раза, провал удвічі менший.
  default_strength: 50
  # Окрема сила для типу колеса: «<тип колеса>: k». Поки всі колеса мають типову.
  strength: {}
  # Скільки переваги дає кожне наступне вкладення в дію: спадна віддача, разом не більше +100.
  investment_curve: [20, 12, 7, 4]

# Стріки генерації (GD §4.10).
streaks:
  very_good_quality: 85
  very_bad_quality: 15
  length: 3

# Коридор бюджету сили (GD §4.11): межі проміжної сили держави у відсотках медіани.
# Варіант обирає хост (GD §3.4); для NPC коридор ширший — світ має і наддержави, і карликові держави.
power_corridors:
  - id: equal_chances
    players: { min_pct: 75, max_pct: 133 }
    npc: { min_pct: 50, max_pct: 200 }
  - id: classic
    players: { min_pct: 50, max_pct: 200 }
    npc: { min_pct: 33, max_pct: 300 }
  - id: full_chaos
    players: { min_pct: 20, max_pct: 500 }
    npc: { min_pct: 10, max_pct: 1000 }

# Ланцюжок коліс генерації (GD §4.6–4.8).
generation:
  backstory_fragments: { min: 2, max: 4 }
  notable_people: { min: 1, max: 3 }
  # Боєголовки стартового арсеналу: рівноймовірно від min до max (1..100).
  warheads: { min: 2, max: 10 }
  # Перевага колеса ядерного статусу за кожен рівень енергетики й науки відносно світового
  # (0..100): −3 → −3·x, +2 → +2·x.
  nuclear_energy_advantage: 10
