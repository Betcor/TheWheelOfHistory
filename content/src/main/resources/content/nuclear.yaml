# Ядерний статус на старті (GD §4.6): 1970 рік — ядерна зброя вже існує.
#
# Кожен статус обов'язковий. Ефекти (вплив, стримування) — разом із системами науки й війни.
#
# Колесо ядерного статусу (GD §4.1, №14); сектори — статуси.
# weight — базова вага сектора, відносна (1..10000); колесо нормалізує ваги до 100%. Без зброї —
# провал, програма — успіх, арсенал — критичний успіх (не рідше 1%, якщо можливий), тож додатна
# перевага веде до ядерної зброї. Перевагу дають лад (wheel:generation_nuclear в ideologies.yaml) і
# розвиненість енергетики й науки (generation.nuclear_energy_advantage у balance.yaml).
# Арсенал неможливий без ресурсу з міткою nuclear_fuel (resources.yaml) або з енергетикою й наукою
# на рівні −2 і нижче. Кількість боєголовок арсеналу — generation.warheads у balance.yaml.
# Арсенал можливий лише в ~20% держав (уран і енергетика), тому його вага вища за частку арсеналів:
# 72/13/15 дають ~3,6% арсеналів і ~15% програм.
# quality — наскільки статус добрий для держави (0..100), для стріків генерації (GD §4.10).

statuses:
  - id: none
    name: Без ядерної зброї
    weight: 72
    quality: 50
  - id: program
    name: Ядерна програма
    weight: 13
    quality: 70
    tags: [nuclear_program]
  - id: arsenal
    name: Ядерний арсенал
    weight: 15
    quality: 90
    tags: [nuclear_power]
