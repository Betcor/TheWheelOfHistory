# Назви держав (GD §4.9): [форма державності] + [корінь]; імена людей (GD §12.3): [ім'я] + [прізвище].
#
# Корінь = початок + (вставка) + кінцівка + закінчення відмінка. Частини — малими українськими літерами,
# першу літеру генератор робить великою. Щоб будь-яке поєднання читалося:
#   - початок закінчується приголосною («вел»);
#   - вставка починається з голосної й закінчується приголосною («ім»);
#   - кінцівка починається з голосної («ор»).
# «вел» + «ім» + «ор» → «Велімор», «Веліморові»… Вставка додається з імовірністю middle_chance_bp.
#
# Парадигма — закінчення кореня за відмінками; корінь при цьому не змінюється. Тому кінцівки жіночого
# роду на г/к/х (Африка → Африці) і на шиплячі (-жа, -ча, -ша) тут не вживаються; fem_iya — лише після «і».
# Відмінки: nominative, genitive, dative, accusative, instrumental, locative (без прийменника), vocative.
#
# Форма державності: корінь стоїть як прикладка в називному, відмінюється лише форма
# («Народної Республіки Велор»). gender — рід повної назви, з ним узгоджуються дієслова в хроніці.
# Форма доступна державі, якщо її ідеологія є в ideologies або підкласифікація — в sub_ideologies.
# Кожній підкласифікації доступна хоча б одна форма.
#
# Стиль, частини й форма обираються рівноймовірно: назва не впливає на ігровий процес.
#
# Імена людей (person_styles) — ті самі мовні стилі: id стилю імен збігається з id стилю назв, і людей держави
# звуть мовою її назви. Ім'я й прізвище збираються з тих самих частин і за тими самими правилами стику, що й корінь.
# Людей відмінюють як істот: знахідний = родовому («бачу Велора», а не «бачу Велор»), тому парадигми окремі (person_*).
# Кінцівки імен діляться за статтю (male — лише чоловічого роду, female — жіночого); кінцівка прізвища має парадигму
# для кожної статі: жіночі прізвища на приголосну й на -о не відмінюються (Ольга Торвер, Ользі Торвер).
# Після г/к/х/ж/ч/ш кличний і давальний відмінюються інакше — такі кінцівки мають окрему парадигму (surname_k,
# surname_ich) або не вживаються.

paradigms:
  # Велор, Велору, Велору, Велор, Велором, Велорі, Велоре
  - id: masc_hard
    gender: masculine
    endings: { nominative: "", genitive: у, dative: у, accusative: "", instrumental: ом, locative: і, vocative: е }
  # Кардель, Карделю, Карделю, Кардель, Карделем, Карделі, Карделю
  - id: masc_soft
    gender: masculine
    endings: { nominative: ь, genitive: ю, dative: ю, accusative: ь, instrumental: ем, locative: і, vocative: ю }
  # Салай, Салаю, Салаю, Салай, Салаєм, Салаї, Салаю
  - id: masc_j
    gender: masculine
    endings: { nominative: й, genitive: ю, dative: ю, accusative: й, instrumental: єм, locative: ї, vocative: ю }
  # Торова, Торови, Торові, Торову, Торовою, Торові, Торово
  - id: fem_hard
    gender: feminine
    endings: { nominative: а, genitive: и, dative: і, accusative: у, instrumental: ою, locative: і, vocative: о }
  # Гарія, Гарії, Гарії, Гарію, Гарією, Гарії, Гаріє
  - id: fem_iya
    gender: feminine
    endings: { nominative: я, genitive: ї, dative: ї, accusative: ю, instrumental: єю, locative: ї, vocative: є }

  # --- Люди ---
  # Велор, Велора, Велорові, Велора, Велором, Велорові, Велоре
  - id: person_masc_hard
    gender: masculine
    endings: { nominative: "", genitive: а, dative: ові, accusative: а, instrumental: ом, locative: ові, vocative: е }
  # Торій, Торія, Торієві, Торія, Торієм, Торієві, Торію
  - id: person_masc_j
    gender: masculine
    endings: { nominative: й, genitive: я, dative: єві, accusative: я, instrumental: єм, locative: єві, vocative: ю }
  # Сулак, Сулака, Сулакові, Сулака, Сулаком, Сулакові, Сулаку
  - id: surname_k
    gender: masculine
    endings: { nominative: "", genitive: а, dative: ові, accusative: а, instrumental: ом, locative: ові, vocative: у }
  # Грімович, Грімовича, Грімовичеві, Грімовича, Грімовичем, Грімовичеві, Грімовичу
  - id: surname_ich
    gender: masculine
    endings: { nominative: "", genitive: а, dative: еві, accusative: а, instrumental: ем, locative: еві, vocative: у }
  # Даненко, Даненка, Даненкові, Даненка, Даненком, Даненкові, Даненку
  - id: surname_enko
    gender: masculine
    endings: { nominative: о, genitive: а, dative: ові, accusative: а, instrumental: ом, locative: ові, vocative: у }
  # Каров, Карова, Карову, Карова, Каровим, Карові, Карове (так само -ін)
  - id: surname_ov
    gender: masculine
    endings: { nominative: "", genitive: а, dative: у, accusative: а, instrumental: им, locative: і, vocative: е }
  # Торвівський, Торвівського, Торвівському, Торвівського, Торвівським, Торвівському, Торвівський
  - id: adj_masc
    gender: masculine
    endings: { nominative: ий, genitive: ого, dative: ому, accusative: ого, instrumental: им, locative: ому, vocative: ий }
  # Торвівська, Торвівської, Торвівській, Торвівську, Торвівською, Торвівській, Торвівська (так само Карова)
  - id: adj_fem
    gender: feminine
    endings: { nominative: а, genitive: ої, dative: ій, accusative: у, instrumental: ою, locative: ій, vocative: а }
  # Незмінні: Калеску, Талані
  - id: fixed_masc
    gender: masculine
    endings: { nominative: "", genitive: "", dative: "", accusative: "", instrumental: "", locative: "", vocative: "" }
  # Незмінні жіночі: Торвер, Сулак, Грімович
  - id: fixed_fem
    gender: feminine
    endings: { nominative: "", genitive: "", dative: "", accusative: "", instrumental: "", locative: "", vocative: "" }
  # Незмінні жіночі на -о: Даненко
  - id: fixed_fem_o
    gender: feminine
    endings: { nominative: о, genitive: о, dative: о, accusative: о, instrumental: о, locative: о, vocative: о }

