# Шаблони карти (GD §3.3). Колесо шаблону — за вагою (відносна, 1..10000), у порядку цього файлу;
# хост може зафіксувати шаблон і кількість материків (GD §3.4). Якщо зафіксовано лише материки,
# колесо обирає серед шаблонів, чий діапазон їх вміщує.
#
# provinces_pct — коефіцієнт шаблону для кількості провінцій, % (100 — без змін): у світі з великою
# часткою моря той самий простір для держав потребує більше провінцій суходолу.
# land_pct — частка суходолу серед комірок карти, % (10..90): провінцій суходолу рівно стільки, скільки дав
# розмір світу, а комірок сітки = провінцій × 100 / land_pct (вгору); решта — море.
# continents — скільки материків: рівні сектори від min до max (1..12).
#
# grid — сітка комірок Вороного, з яких складаються провінції й море (GD §3.5):
#   cell_size — середня сторона комірки в одиницях карти (20..1000): площа карти = комірок × cell_size²;
#   aspect — пропорція карти, ширина : висота (кожна 1..4);
#   relaxation — ітерації релаксації Ллойда (0..10): більше — рівніші за площею провінції.

grid:
  cell_size: 100
  aspect: { width: 2, height: 1 }
  relaxation: 2

# continents — як суходіл ділиться між материками (GD §3.5): кожен материк росте від свого зерна по сусідніх
# комірках, доки не набере свою частку провінцій; материки розділені щонайменше однією коміркою моря.
#   size_weight — діапазон колеса ваги материка (1..100): рівні сектори, провінції діляться пропорційно вагам;
#   min_provinces — щонайменше провінцій на материк (1..1000), решта ділиться за вагами;
#   roughness — порізаність берегів, % (0..100): шум множить відстань від зерна на 1 ± roughness; 0 — материк
#     росте колом;
#   noise_cells — розмір плям шуму в комірках (1..100): більше — ширші затоки й півострови.
continents:
  size_weight: { min: 1, max: 4 }
  min_provinces: 20
  roughness: 60
  noise_cells: 8

templates:
  - id: continents
    name: Континенти
    description: Кілька великих материків, розділених океанами.
    weight: 35
    provinces_pct: 100
    land_pct: 35
    continents: { min: 2, max: 4 }
  - id: pangaea
    name: Пангея
    description: Один суцільний материк — сусіди всюди, флот важить мало.
    weight: 20
    provinces_pct: 90
    land_pct: 40
    continents: { min: 1, max: 1 }
  - id: archipelago
    name: Архіпелаг
    description: Багато невеликих масивів суходолу — світ флотів і десантів.
    weight: 15
    provinces_pct: 120
    land_pct: 30
    continents: { min: 5, max: 8 }
  - id: earth_like
    name: Земля-подібна
    description: Материки різного розміру, як на Землі.
    weight: 30
    provinces_pct: 110
    land_pct: 30
    continents: { min: 4, max: 6 }
