# Шаблони карти (GD §3.3). Колесо шаблону — за вагою (відносна, 1..10000), у порядку цього файлу;
# хост може зафіксувати шаблон і кількість материків (GD §3.4). Якщо зафіксовано лише материки,
# колесо обирає серед шаблонів, чий діапазон їх вміщує.
#
# provinces_pct — коефіцієнт шаблону для кількості провінцій, % (100 — без змін): у світі з великою
# часткою моря той самий простір для держав потребує більше провінцій суходолу.
# land_pct — частка суходолу серед комірок карти, % (10..90): провінцій суходолу рівно стільки, скільки дав
# розмір світу, а комірок сітки = провінцій × 100 / land_pct (вгору); решта — море.
# continents — скільки материків: рівні сектори від min до max (1..12).
#
# grid — сітка комірок Вороного, з яких складаються провінції й море (GD §3.5):
#   cell_size — середня сторона комірки в одиницях карти (20..1000): площа карти = комірок × cell_size²;
#   aspect — пропорція карти, ширина : висота (кожна 1..4);
#   relaxation — ітерації релаксації Ллойда (0..10): більше — рівніші за площею провінції.

grid:
  cell_size: 100
  aspect: { width: 2, height: 1 }
  relaxation: 2

# continents — як суходіл ділиться між материками (GD §3.5): кожен материк росте від свого зерна по сусідніх
# комірках, доки не набере свою частку провінцій; материки розділені щонайменше однією коміркою моря.
#   size_weight — діапазон колеса ваги материка (1..100): рівні сектори, провінції діляться пропорційно вагам;
#   min_provinces — щонайменше провінцій на материк (1..1000), решта ділиться за вагами;
#   roughness — порізаність берегів, % (0..100): шум множить відстань від зерна на 1 ± roughness; 0 — материк
#     росте колом;
#   noise_cells — розмір плям шуму в комірках (1..100): більше — ширші затоки й півострови.
continents:
  size_weight: { min: 1, max: 4 }
  min_provinces: 20
  roughness: 60
  noise_cells: 8

# relief — висота й рельєф суходолу (GD §3.5). Кожен материк отримує гірські хребти — ламані від внутрішньої
# комірки у два боки; висота провінції = base_height + внесок найближчого хребта + шум, обрізано до 0..100.
#   ridges — діапазон колеса кількості хребтів материка (0..10): рівні сектори;
#   ridge_min_provinces — провінцій на один хребет щонайменше (1..1000): малий материк отримує менше хребтів;
#   ridge_length_pct — довжина хребта, % поперечника материка (кореня з кількості провінцій), 1..200;
#   ridge_wander — на скільки градусів хребет щонайбільше звертає за крок (0..60);
#   ridge_height — надбавка висоти на самому хребті (0..100);
#   ridge_falloff — на скільки надбавка меншає за кожен крок від хребта (1..100): менше — ширші передгір'я;
#   base_height — висота рівнини далеко від хребтів (0..100);
#   noise_amplitude — найбільший внесок шуму в будь-який бік (0..100): окремі пагорби серед рівнин;
#   noise_cells — розмір плям шуму в комірках (1..100);
#   levels — рівні рельєфу в порядку висоти: min_height — з якої висоти починається рівень (рівнина — з 0).
#     Ліс, пустеля, тундра й болото — покрив за кліматом (див. climate), не рельєф.
relief:
  ridges: { min: 1, max: 3 }
  ridge_min_provinces: 40
  ridge_length_pct: 100
  ridge_wander: 20
  ridge_height: 75
  ridge_falloff: 30
  base_height: 20
  noise_amplitude: 25
  noise_cells: 4
  levels:
    - id: plain
      name: Рівнина
      description: Відкрита місцевість — простір для танків і полів.
      min_height: 0
    - id: hills
      name: Пагорби
      description: Горбиста місцевість — обороні легше, наступу важче.
      min_height: 40
    - id: mountains
      name: Гори
      description: Гірські хребти — природна фортеця й перешкода для постачання.
      min_height: 70

# climate — клімат суходолу (GD §3.5). Температура й волога — шкала 0..100, пояс і покрив — за порогами нижче.
#   worlds — колесо клімату світу за вагою (відносна, 1..10000), у порядку цього файлу: temperature_shift зсуває
#     температуру всієї карти (−50..50);
#   temperature — температура провінції: від equator на середній лінії карти до pole на верхньому й нижньому краях
#     (лінійно за відстанню від екватора), + зсув світу, − висота × height_cooling / 100 (гори холодніші), + шум у межах
#     ±noise_amplitude;
#   moisture — волога провінції: coast у береговій провінції, − inland_drying за кожен крок углиб суходолу, + шум у
#     межах ±noise_amplitude;
#   noise_cells — розмір плям шуму температури й вологи в комірках (1..100);
#   polar_below / boreal_below — температура, нижче якої пояс полярний / бореальний; arid_below — волога, нижче якої
#     теплий пояс посушливий; tropical_from — температура, з якої вологий пояс тропічний; решта — помірний;
#   zones — назви поясів;
#   covers — покрив (ліс, пустеля, тундра, болото) перетворює рівнини й пагорби: провінція отримує перший у порядку
#     цього файлу покрив, чиї пояси (climates), рельєф (reliefs), волога (moisture) і висота (height) їй підходять, або
#     жодного. Гори покриву не мають.
climate:
  worlds:
    - id: cold
      name: Холодний світ
      description: Льодовики сповзли нижче — більше тундри й тайги, менше тропіків.
      weight: 25
      temperature_shift: -8
    - id: temperate
      name: Помірний світ
      description: Клімат, звичний для Землі другої половини XX століття.
      weight: 50
      temperature_shift: 0
    - id: warm
      name: Теплий світ
      description: Тропіки й пустелі розлогі, полярні шапки малі.
      weight: 25
      temperature_shift: 8
  temperature: { equator: 90, pole: 0, height_cooling: 30, noise_amplitude: 10 }
  moisture: { coast: 65, inland_drying: 8, noise_amplitude: 35 }
  noise_cells: 6
  polar_below: 15
  boreal_below: 35
  tropical_from: 70
  arid_below: 30
  zones:
    - id: polar
      name: Полярний
      description: Вічна мерзлота й довга зима — наступ можливий лише влітку.
    - id: boreal
      name: Бореальний
      description: Холодна зима й коротке літо — тайга й багнища.
    - id: temperate
      name: Помірний
      description: Чотири виразні сезони — осіннє й весняне бездоріжжя.
    - id: arid
      name: Посушливий
      description: Мало води — спека, пил і важке постачання.
    - id: tropical
      name: Тропічний
      description: Спека й зливи круглий рік — джунглі та хвороби.
  covers:
    - id: tundra
      name: Тундра
      description: Мерзла безлісна рівнина — мало людей і доріг.
      climates: [polar]
      reliefs: [plain, hills]
      moisture: { min: 0, max: 100 }
      height: { min: 0, max: 100 }
    - id: swamp
      name: Болото
      description: Драговина — техніка грузне, оборона тримається.
      climates: [boreal, temperate, tropical]
      reliefs: [plain]
      moisture: { min: 85, max: 100 }
      height: { min: 0, max: 25 }
    - id: desert
      name: Пустеля
      description: Пісок і каміння — простір для маневру, але немає води.
      climates: [arid]
      reliefs: [plain, hills]
      moisture: { min: 0, max: 15 }
      height: { min: 0, max: 100 }
    - id: forest
      name: Ліс
      description: Густий ліс — укриття для оборони й партизанів.
      climates: [boreal, temperate, tropical]
      reliefs: [plain, hills]
      moisture: { min: 55, max: 100 }
      height: { min: 0, max: 100 }

# sea — море й озера (GD §3.5). Водойма — зв'язна область комірок води.
#   min_cells — скільки комірок щонайменше має водойма, щоб бути морем (1..1000); менша — озеро: флот туди не
#     запливає, морських зон немає, вихід до моря не дає;
#   zone_cells — скільки комірок моря в середньому на морську зону (1..1000): кожне море ділиться на
#     max(1, комірок / zone_cells) зон з округленням до найближчого; зони зв'язні й приблизно рівні.
sea:
  min_cells: 10
  zone_cells: 40

# rivers — річки (GD §3.5). Вода з кожної провінції стікає до сусідньої, найнижчої на шляху до води, і так до моря
# чи озера (з озера далі не тече). Стік провінції — сума вологи (0..100, див. climate) її й усіх провінцій, що
# стікають через неї.
#   min_flow — з якого стоку в провінції є річка (101..1000000): одна провінція сама річки не дає, потрібен басейн;
#     менше — більше річок і довші притоки;
#   min_cells — найменше провінцій у річковій системі — річці з притоками до одного гирла (1..100): коротша система —
#     струмок біля берега, не річка.
rivers:
  min_flow: 200
  min_cells: 3

# fertility — родючість провінції (GD §3.5), 0..100, без коліс: основа поясу (climates) + поправка типу місцевості
# (terrains) + волога × moisture_pct / 100 (вниз) + river, якщо провінцією тече річка; сума обрізається до 0..100.
#   climates — основа на кожен пояс (0..100);
#   terrains — поправка на кожен тип місцевості (−100..100): рельєф або покрив, якщо він є (див. climate.covers);
#   moisture_pct — скільки відсотків вологи провінції додається (0..100): вологіші землі родючіші в межах поясу;
#   river — бонус провінції з річкою (0..100): заплава й вода для зрошення, навіть у пустелі.
fertility:
  climates: { polar: 5, boreal: 25, temperate: 50, arid: 20, tropical: 45 }
  terrains: { plain: 10, hills: 0, mountains: -30, forest: -10, desert: -25, tundra: -10, swamp: -25 }
  moisture_pct: 25
  river: 20

templates:
  - id: continents
    name: Континенти
    description: Кілька великих материків, розділених океанами.
    weight: 35
    provinces_pct: 100
    land_pct: 35
    continents: { min: 2, max: 4 }
  - id: pangaea
    name: Пангея
    description: Один суцільний материк — сусіди всюди, флот важить мало.
    weight: 20
    provinces_pct: 90
    land_pct: 40
    continents: { min: 1, max: 1 }
  - id: archipelago
    name: Архіпелаг
    description: Багато невеликих масивів суходолу — світ флотів і десантів.
    weight: 15
    provinces_pct: 120
    land_pct: 30
    continents: { min: 5, max: 8 }
  - id: earth_like
    name: Земля-подібна
    description: Материки різного розміру, як на Землі.
    weight: 30
    provinces_pct: 110
    land_pct: 30
    continents: { min: 4, max: 6 }
