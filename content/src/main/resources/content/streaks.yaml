# Колеса стріків генерації (GD §4.10).
#
# Кожен результат колеса генерації має якість 0..100. Дуже добрі (≥ streaks.very_good_quality)
# або дуже погані (≤ streaks.very_bad_quality) результати поспіль — streaks.length у balance.yaml —
# запускають колесо свого стріку: «Золота доба» — після дуже добрих, «Андердог» — після дуже поганих
# (компенсація, а не покарання). Нейтральні колеса (лад, кількості, відомі люди, назва, самі колеса
# стріків) не рахуються й стрік не обривають; будь-який інший результат не з крайніх — обриває.
# Кожне колесо — щонайбільше раз за генерацію держави.
#
# Кожен вид обов'язковий: golden_age і underdog. tags — мітки, які держава отримує за будь-якої
# нагороди колеса.
#
# Нагороди — сектори колеса в порядку цього файлу; одне обертання, перевага не діє.
# weight — вага сектора, відносна (1..10000); колесо нормалізує ваги до 100%.
# duration — скільки років діють модифікатори від 01.01.1970 (1..100); без поля — постійно.
# fate_tokens — жетони долі (0..3); понад ліміт 3 жетони згорають.
# extra_people — додаткові стартові постаті (0..3).
# tags — мітки нагороди. Нагорода мусить щось давати: модифікатори, жетони, постатей чи мітки.
#
# Сектори, що залежать від карти й доктрин (рідкісний ресурс, партизанська доктрина), додамо разом
# із ними.

wheels:
  - id: golden_age
    name: Золота доба
    description: Усе вдається поспіль — і світ це помічає. Сусіди охочіше об'єднуються проти такої держави.
    tags: [golden_age, world_attention]
    rewards:
      - id: national_pride
        name: Національна гордість
        description: Успіхи згуртували країну довкола влади.
        weight: 100
        duration: 10
        modifiers:
          - { target: "stat:stability", value: 10 }
      - id: world_prestige
        name: Світовий престиж
        description: До голосу держави прислухаються далеко за її кордонами.
        weight: 100
        duration: 10
        modifiers:
          - { target: "stat:influence", value: 10 }
      - id: strong_mandate
        name: Міцний мандат
        description: Ніхто не сумнівається, що влада має право правити.
        weight: 100
        duration: 10
        modifiers:
          - { target: "stat:legitimacy", value: 10 }
      - id: great_figure
        name: Видатна постать
        description: Доба успіхів народила ще одну людину, про яку говорять усі.
        weight: 100
        extra_people: 1

  - id: underdog
    name: Андердог
    description: Доля била державу знову й знову — тепер вона має шанс відігратися.
    tags: [underdog]
    rewards:
      - id: second_chance
        name: Другий шанс
        description: Ще два жетони долі, щоб перекрутити невдалі колеса.
        weight: 100
        fate_tokens: 2
      - id: united_by_hardship
        name: Згуртовані бідою
        description: Спільне лихо згуртувало народ.
        weight: 100
        duration: 10
        modifiers:
          - { target: "stat:stability", value: 10 }
      - id: international_sympathy
        name: Міжнародне співчуття
        description: Світ співчуває державі й охочіше допомагає їй і торгує з нею.
        weight: 100
        duration: 10
        tags: [international_sympathy]
        modifiers:
          - { target: "stat:influence", value: 5 }
