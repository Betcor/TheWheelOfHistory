# Ідеології та підкласифікації (GD §4.2).
#
# Модифікатори — постійні, діють на державу з цією ідеологією й підкласифікацією.
# Ціль: stat:<показник> (stability, hdi, influence, legitimacy, war_weariness, gdp, science)
#       або wheel:<тип колеса>.
# Числа — початкові значення для балансу. Ефекти, для яких ще немає систем (наука, армія, торгівля,
# мобілізація, швидкість рішень), поки що виражені лише тегами.
# Колеса генерації (GD §4.1, №5–6): спершу ідеологія, потім підкласифікація серед підкласифікацій
# обраної ідеології. Ваги — відносні (1..10000), колесо нормалізує їх до 100%.
# Порядок ідеологій і підкласифікацій — порядок секторів коліс.
# Перевага колеса розвиненості галузі (GD §4.1, №7): wheel:generation_development_<галузь>, де галузь —
# economy, military, society або energy_science (development.yaml). Модифікатори ідеології й
# підкласифікації складаються.
# Перевага колеса ядерного статусу (GD §4.1, №14): wheel:generation_nuclear.
# Перевага колеса ВВП на душу (GD §4.1, №8): wheel:generation_gdp.
# Перевага колеса ІЛР (GD §4.1, №9): wheel:generation_hdi.
# Перевага колеса розміру армії (GD §4.1, №10): wheel:generation_army_size.

ideologies:
  - id: democracy
    name: Демократія
    weight: 100
    tags: [democratic]
    modifiers:
      - { target: "stat:hdi", value: 5 }
      - { target: "stat:legitimacy", value: 10 }
      - { target: "wheel:generation_development_economy", value: 10 }
      - { target: "wheel:generation_development_society", value: 10 }
      - { target: "wheel:generation_development_energy_science", value: 10 }
      - { target: "wheel:generation_gdp", value: 10 }
      - { target: "wheel:generation_hdi", value: 10 }
    sub_ideologies:
      - id: liberal_democracy
        name: Ліберальна демократія
        weight: 100
        tags: [liberal]
        modifiers:
          - { target: "stat:influence", value: 5 }
      - id: social_democracy
        name: Соціал-демократія
        weight: 100
        tags: [welfare_state]
        modifiers:
          - { target: "stat:hdi", value: 5 }
          - { target: "wheel:generation_hdi", value: 10 }
      - id: direct_democracy
        name: Пряма демократія
        weight: 100
        tags: [direct_democracy]
        modifiers:
          - { target: "stat:legitimacy", value: 5 }
      - id: constitutional_monarchy
        name: Конституційна монархія
        weight: 100
        tags: [monarch]
        modifiers:
          - { target: "stat:stability", value: 5 }

  - id: authoritarianism
    name: Авторитаризм
    weight: 100
    tags: [authoritarian]
    sub_ideologies:
      - id: military_junta
        name: Військова хунта
        weight: 100
        tags: [junta, militarism]
        modifiers:
          - { target: "stat:legitimacy", value: -10 }
          - { target: "wheel:generation_development_military", value: 15 }
          - { target: "wheel:generation_army_size", value: 15 }
      - id: oligarchy
        name: Олігархія
        weight: 100
        tags: [oligarchy]
        modifiers:
          - { target: "stat:hdi", value: -5 }
          - { target: "wheel:generation_development_society", value: -10 }
          - { target: "wheel:generation_hdi", value: -10 }
      - id: technocracy
        name: Технократія
        weight: 100
        tags: [technocracy]
        modifiers:
          - { target: "wheel:generation_development_energy_science", value: 20 }
          - { target: "wheel:generation_development_economy", value: 10 }
          - { target: "wheel:generation_nuclear", value: 10 }
      - id: managed_democracy
        name: «Керована демократія»
        weight: 100
        tags: [managed_democracy]
        modifiers:
          - { target: "stat:legitimacy", value: 5 }

  - id: totalitarianism
