    figure_case: genitive
    archetypes: [polytheism]
    forms:
      nominative: "Храм {figure}"
      genitive: "Храму {figure}"
      dative: "Храмові {figure}"
      accusative: "Храм {figure}"
      instrumental: "Храмом {figure}"
      locative: "Храмі {figure}"
      vocative: "Храме {figure}"
  - id: pantheon
