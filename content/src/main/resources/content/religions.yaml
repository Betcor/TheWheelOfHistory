    gender: feminine
    figure_case: genitive
    archetypes: [animism]
    forms:
      nominative: "Стежка {figure}"
      genitive: "Стежки {figure}"
      dative: "Стежці {figure}"
      accusative: "Стежку {figure}"
      instrumental: "Стежкою {figure}"
      locative: "Стежці {figure}"
      vocative: "Стежко {figure}"
