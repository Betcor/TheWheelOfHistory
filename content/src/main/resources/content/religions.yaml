    figure_case: genitive
    archetypes: [polytheism]
    forms:
      nominative: "Пантеон {figure}"
      genitive: "Пантеону {figure}"
      dative: "Пантеонові {figure}"
      accusative: "Пантеон {figure}"
      instrumental: "Пантеоном {figure}"
      locative: "Пантеоні {figure}"
      vocative: "Пантеоне {figure}"
  - id: light
    gender: neuter
    figure_case: genitive
    archetypes: [dualism]
    forms:
      nominative: "Світло {figure}"
      genitive: "Світла {figure}"
      dative: "Світлу {figure}"
      accusative: "Світло {figure}"
      instrumental: "Світлом {figure}"
      locative: "Світлі {figure}"
      vocative: "Світло {figure}"
  - id: path
    gender: masculine
    figure_case: genitive
    archetypes: [ancestor_cult, animism, philosophy]
    forms:
      nominative: "Шлях {figure}"
      genitive: "Шляху {figure}"
      dative: "Шляхові {figure}"
      accusative: "Шлях {figure}"
      instrumental: "Шляхом {figure}"
      locative: "Шляху {figure}"
      vocative: "Шляху {figure}"
  - id: teaching
    gender: neuter
    figure_case: genitive
    archetypes: [philosophy]
    forms:
      nominative: "Вчення {figure}"
      genitive: "Вчення {figure}"
      dative: "Вченню {figure}"
      accusative: "Вчення {figure}"
      instrumental: "Вченням {figure}"
