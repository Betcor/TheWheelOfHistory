    forms:
      nominative: "Завіт {figure}"
      genitive: "Завіту {figure}"
      dative: "Завітові {figure}"
      accusative: "Завіт {figure}"
      instrumental: "Завітом {figure}"
      locative: "Завіті {figure}"
      vocative: "Завіте {figure}"
  - id: temple
