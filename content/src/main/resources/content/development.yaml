# Технологічна розвиненість (GD §4.3): рівень держави в кожній галузі відносно світового рівня
# 1970 року. Усі живуть у 1970 році, але розвинені по-різному.
#
# Галузі відповідають гілкам дерева технологій (GD §9.1); кожна обов'язкова.
# Рівні — від −3 до +2, кожен обов'язковий. Які технології дерева відкриває рівень, визначить
# дерево технологій; ваги колеса розвиненості — ланцюжок коліс генерації.

branches:
  - id: economy
    name: Економіка
  - id: military
    name: Військо
  - id: society
    name: Суспільство
  - id: energy_science
    name: Енергетика й наука

levels:
  - level: -3
    name: Глибоке відставання
    description: Знає лише базові технології дерева; відстала армія.
  - level: -2
    name: Відставання
    description: Частина технологій 1970 року недоступна.
  - level: -1
    name: Легке відставання
    description: Окремих технологій 1970 року бракує.
  - level: 0
    name: Світовий рівень
    description: Усі стартові технології 1970 року.
  - level: 1
    name: Передовий
    description: На 1–2 технології попереду світу.
  - level: 2
    name: Лідер
    description: Кілька технологій попереду світу; буває рідко.
