# Технологічна розвиненість (GD §4.3): рівень держави в кожній галузі відносно світового рівня
# 1970 року. Усі живуть у 1970 році, але розвинені по-різному.
#
# Галузі відповідають гілкам дерева технологій (GD §9.1); кожна обов'язкова.
# Рівні — від −3 до +2, кожен обов'язковий. Які технології дерева відкриває рівень, визначить
# дерево технологій.
#
# Колесо розвиненості (GD §4.1, №7) крутиться окремо для кожної галузі; сектори — рівні.
# weight — базова вага сектора, відносна (1..10000); колесо нормалізує ваги до 100%. Лад зсуває
# шанси перевагою: модифікатори ідеологій і підкласифікацій з ціллю
# wheel:generation_development_<галузь> (ideologies.yaml). Рівні нижче світового — провали (−3 —
# критичний), вище — успіхи (+2 — критичний), тож додатна перевага веде до вищих рівнів; критичні
# рівні не бувають рідше 1%.
# quality — наскільки рівень добрий для держави (0..100); у стрік генерації (GD §4.10) іде одна
# якість — середня за чотирма галузями, округлена вниз.
# tags — мітки держави, якщо хоча б одна галузь на цьому рівні (див. generation_tags у backstory.yaml).

branches:
  - id: economy
    name: Економіка
  - id: military
    name: Військо
  - id: society
    name: Суспільство
  - id: energy_science
    name: Енергетика й наука

levels:
  - level: -3
    name: Глибоке відставання
    description: Знає лише базові технології дерева; відстала армія.
    weight: 8
    quality: 5
    tags: [backward]
  - level: -2
    name: Відставання
    description: Частина технологій 1970 року недоступна.
    weight: 14
    quality: 15
    tags: [backward]
  - level: -1
    name: Легке відставання
    description: Окремих технологій 1970 року бракує.
    weight: 22
    quality: 35
  - level: 0
    name: Світовий рівень
    description: Усі стартові технології 1970 року.
    weight: 30
    quality: 50
  - level: 1
    name: Передовий
    description: На 1–2 технології попереду світу.
    weight: 18
    quality: 75
    tags: [advanced]
  - level: 2
    name: Лідер
    description: Кілька технологій попереду світу; буває рідко.
    weight: 8
    quality: 95
    tags: [advanced]
