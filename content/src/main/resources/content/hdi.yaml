# Індекс людського розвитку на старті (GD §4.1, колесо 9; GD §5.1: 0–100 — якість життя, освіта,
# здоров'я). Значення рівня — базовий ІЛР держави; модифікатори ладу й передісторії (stat:hdi)
# діють поверх нього.
#
# Колесо ІЛР; сектори — рівні в порядку цього файлу. Рівні йдуть від найнижчого до найвищого:
# hdi строго зростає, tier не спадає.
# tier — як на рівень діє перевага: crit_fail / fail — нижчі (зменшуються з додатною перевагою),
# partial — нейтральний, success / crit_success — вищі (ростуть); критичні не бувають рідше 1%.
# Перевагу дають лад (wheel:generation_hdi в ideologies.yaml) і ВВП: крок рівня результату рівня
# ВВП від partial (gdp.yaml: crit_fail −2 … crit_success +2) × generation.hdi_gdp_advantage
# у balance.yaml.
# weight — базова вага сектора, відносна (1..10000); колесо нормалізує ваги до 100%.
# quality — наскільки рівень добрий для держави (0..100), для стріків генерації (GD §4.10).
# tags — мітки держави на цьому рівні: low_hdi — два нижчі рівні, high_hdi — два вищі. Від них
# залежать типи стартових постатей (people.yaml) і можуть залежати фрагменти передісторії.

levels:
  - id: very_low
    name: Дуже низький розвиток
    description: Голод, епідемії й неписьменність; більшість не доживає до старості.
    hdi: 15
    tier: crit_fail
    weight: 8
    quality: 5
    tags: [low_hdi]
  - id: low
    name: Низький розвиток
    description: Лікарні й школи — лише в столиці, на селі їх майже немає.
    hdi: 30
    tier: fail
    weight: 17
    quality: 20
    tags: [low_hdi]
  - id: lower_middle
    name: Розвиток нижче середнього
    description: Початкова школа для більшості, але медицина слабка, а дитяча смертність висока.
    hdi: 45
    tier: fail
    weight: 22
    quality: 40
  - id: middle
    name: Середній розвиток
    description: Загальна освіта й базова медицина; життя скромне, але передбачуване.
    hdi: 60
    tier: partial
    weight: 24
    quality: 50
  - id: high
    name: Високий розвиток
    description: Довге життя, університети й соціальні гарантії для більшості.
    hdi: 75
    tier: success
    weight: 19
    quality: 75
    tags: [high_hdi]
  - id: very_high
    name: Дуже високий розвиток
    description: Одна з найкращих у світі якостей життя, освіти й охорони здоров'я.
    hdi: 90
    tier: crit_success
    weight: 10
    quality: 95
    tags: [high_hdi]
