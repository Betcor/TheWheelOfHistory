# Тексти CLI tools:sim. Підстановка {0}, {1}… — простою заміною, апострофи подвоювати не треба.
# Пробіли на початку значення зберігаються лише як «\ ».

usage=Використання:\n\
\  country --seed <число> [--players <1..16>] [--npc few|normal|many] [--country <номер>] [--rolls]\n\
\          [--content <каталог>]\n\
\      згенерувати світ — карту, релігії й усі держави — і показати державу; --players — гравців (типово 1),\n\
\      --npc — частка NPC-держав (типово normal), --country — номер держави (типово 0),\n\
\      --rolls — усі обертання коліс, --content — контент з каталогу замість вбудованого

