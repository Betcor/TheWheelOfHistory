usage=Використання:\n\
\  country --seed <число> [--countries <1..1000>] [--resources <id,id,…>] [--rolls] [--content <каталог>]\n\
\      згенерувати державу ланцюжком коліс; --countries — розмір світу для кількості релігій (типово 20),\n\
\      --resources — ресурси держави (поки немає карти), --rolls — усі обертання коліс,\n\
\      --content — контент з каталогу замість вбудованого

